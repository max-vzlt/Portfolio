<title>Portfolio Maxime Verzeletti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Mona+Sans:wght@400;500;600;700&family=Oswald:wght@200;300;400&display=swap">
<style>
/* Static preview of the Nuxt portfolio (same design system, no server).
   Layout: 3-column grid, blue & white bands. Single committed look (blue / paper). */
:root {
  --blue: #0037ff;
  --blue-deep: #090bd0;
  --blue-soft: #c9c7ff;
  --paper: #f4f3ff;
  --white: #ffffff;

  --bg: var(--paper);
  --fg: var(--blue-deep);
  --accent: var(--blue);
  --muted: color-mix(in srgb, var(--blue-deep) 62%, var(--paper));
  --line: color-mix(in srgb, var(--blue) 20%, transparent);
  --line-strong: color-mix(in srgb, var(--blue) 55%, transparent);
  --surface: color-mix(in srgb, var(--blue) 6%, var(--paper));

  --font-display: 'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Mona Sans', 'Helvetica Neue', Arial, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  --container: 1240px;
  --gutter: clamp(16px, 4.2vw, 56px);
  --pad-l: max(var(--gutter), env(safe-area-inset-left, 0px));
  --pad-r: max(var(--gutter), env(safe-area-inset-right, 0px));
  --gap: clamp(16px, 2.3vw, 32px);
  --row: clamp(150px, 15vw, 230px);
  --card-h: clamp(220px, 24vw, 340px);
  --header-h: 84px;
  --radius: 2px;
  --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  --ease-io: cubic-bezier(0.65, 0, 0.35, 1);
  --night: #050828;
  --night-2: #0b1046;
  --ink-light: #ecebff;
  --accent-light: #91a6ff;
  --page: var(--paper);
  --ink: var(--blue-deep);
  --rule: color-mix(in srgb, var(--blue) 18%, transparent);
  color-scheme: light;
}
/* dark theme: follows the system, or the viewer's explicit choice (data-theme) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark; --page: var(--night); --ink: var(--ink-light); --rule: color-mix(in srgb, var(--ink-light) 14%, transparent);
    --fg: var(--ink-light); --accent: var(--accent-light); --muted: color-mix(in srgb, var(--ink-light) 60%, var(--night));
    --line: color-mix(in srgb, var(--ink-light) 13%, transparent); --line-strong: color-mix(in srgb, var(--ink-light) 30%, transparent); --surface: var(--night-2);
  }
  :root:not([data-theme="light"]) .tone-paper {
    --accent: var(--accent-light); --muted: color-mix(in srgb, var(--ink-light) 60%, var(--night));
    --line: color-mix(in srgb, var(--ink-light) 13%, transparent); --line-strong: color-mix(in srgb, var(--ink-light) 30%, transparent); --surface: var(--night-2);
  }
  :root:not([data-theme="light"]) .tone-paper .btn-solid:hover { --btn-bg: var(--blue-soft); --btn-fg: var(--blue-deep); }
}
:root[data-theme="dark"] {
  color-scheme: dark; --page: var(--night); --ink: var(--ink-light); --rule: color-mix(in srgb, var(--ink-light) 14%, transparent);
  --fg: var(--ink-light); --accent: var(--accent-light); --muted: color-mix(in srgb, var(--ink-light) 60%, var(--night));
  --line: color-mix(in srgb, var(--ink-light) 13%, transparent); --line-strong: color-mix(in srgb, var(--ink-light) 30%, transparent); --surface: var(--night-2);
}
:root[data-theme="dark"] .tone-paper {
  --accent: var(--accent-light); --muted: color-mix(in srgb, var(--ink-light) 60%, var(--night));
  --line: color-mix(in srgb, var(--ink-light) 13%, transparent); --line-strong: color-mix(in srgb, var(--ink-light) 30%, transparent); --surface: var(--night-2);
}
:root[data-theme="dark"] .tone-paper .btn-solid:hover { --btn-bg: var(--blue-soft); --btn-fg: var(--blue-deep); }

*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--page); }
body {
  margin: 0;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  font-weight: 420;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--blue); }
img, video, canvas, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p, ul, dl, dd, figure, blockquote { margin: 0; }
ul { padding: 0; list-style: none; }
::selection { background: var(--blue-deep); color: var(--paper); }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 1em; height: 1em; flex: none; }

.tone-blue {
  --bg: var(--blue); --fg: var(--paper); --accent: var(--white);
  --muted: color-mix(in srgb, var(--paper) 72%, var(--blue));
  --line: color-mix(in srgb, var(--paper) 24%, transparent);
  --line-strong: color-mix(in srgb, var(--paper) 60%, transparent);
  --surface: var(--blue-deep);
  background: var(--bg); color: var(--fg);
}
.tone-paper { --bg: var(--page); --fg: var(--ink); --accent: var(--blue); background: var(--bg); color: var(--fg); }

.wrap { max-width: calc(var(--container) + var(--pad-l) + var(--pad-r)); margin-inline: auto; padding-left: var(--pad-l); padding-right: var(--pad-r); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
@media (max-width: 1023px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 639px) { .grid3 { grid-template-columns: minmax(0, 1fr); } }
.section { position: relative; padding-block: clamp(72px, 11vw, 160px); }
.section.tone-paper + .section.tone-paper, .section.tone-blue + .section.tone-blue { padding-top: clamp(24px, 4vw, 56px); }

.display-xl, .display-l, .display-m, .display-s { font-family: var(--font-display); font-weight: 300; letter-spacing: -0.012em; line-height: .95; text-wrap: balance; }
.display-xl { font-size: clamp(3.2rem, 8.4vw, 8.4rem); line-height: .92; }
.display-l { font-size: clamp(2.7rem, 6.2vw, 6rem); }
.display-m { font-size: clamp(1.9rem, 2.8vw, 2.7rem); line-height: 1; }
.display-s { font-size: clamp(1.4rem, 1.9vw, 1.75rem); line-height: 1.08; font-weight: 350; }
.label { font-family: var(--font-mono); font-size: 11px; line-height: 1.4; letter-spacing: .06em; text-transform: uppercase; font-weight: 450; }
.nav-label { font-family: var(--font-display); font-size: 14px; font-weight: 400; letter-spacing: .09em; text-transform: uppercase; }
.lead { font-size: clamp(1.08rem, 1.35vw, 1.3rem); line-height: 1.5; }
.muted { color: var(--muted); }
.rich :where(p + p, p + ul, ul + p) { margin-top: .9em; }
.rich strong { font-weight: 640; color: var(--accent); }
.rich a { text-decoration: underline; text-underline-offset: 3px; }
.rich ul li { position: relative; padding-left: 1.2em; }
.rich ul li::before { content: ''; position: absolute; left: .1em; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.btn {
  --btn-bg: transparent; --btn-fg: var(--fg);
  display: inline-flex; align-items: center; gap: 9px; min-height: 40px; padding: 9px 14px;
  border: 1px solid transparent; border-radius: var(--radius); background: var(--btn-bg); color: var(--btn-fg);
  font-family: var(--font-display); font-size: 14px; font-weight: 400; letter-spacing: .05em; text-transform: uppercase; line-height: 1; white-space: nowrap;
  transition: background .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease);
}
.btn .ico { width: 17px; height: 17px; }
.btn-solid { --btn-bg: var(--blue); --btn-fg: var(--paper); }
.btn-solid:hover { --btn-bg: var(--blue-deep); }
.tone-blue .btn-solid { --btn-bg: var(--paper); --btn-fg: var(--blue); }
.tone-blue .btn-solid:hover { --btn-bg: var(--white); --btn-fg: var(--blue-deep); }
.btn-ghost { --btn-bg: color-mix(in srgb, var(--fg) 14%, transparent); }
.btn-ghost:hover { --btn-bg: color-mix(in srgb, var(--fg) 24%, transparent); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px 4px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: transparent; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; line-height: 1.2; transition: background .2s, color .2s, border-color .2s; }
button.chip:hover { border-color: var(--fg); }
.chip.is-active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip sup { font-size: 9px; opacity: .7; }
.link-underline { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .45s var(--ease); padding-bottom: 2px; }
.link-underline:hover, .link-underline.is-active { background-size: 100% 1px; }
.view-in { animation: viewIn .55s var(--ease) both; }
@keyframes viewIn { from { transform: translate3d(0, 14px, 0); } to { transform: none; } }

/* scrollbars: page one is custom (#sbar), inner ones thin and blue */
html { scrollbar-width: none; }
html::-webkit-scrollbar { width: 0; height: 0; display: none; }
* { scrollbar-width: thin; scrollbar-color: var(--blue) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 6px; border: 1px solid var(--paper); }
.sbar { position: fixed; z-index: 95; top: calc(env(safe-area-inset-top, 0px) + 6px); bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); right: calc(env(safe-area-inset-right, 0px) + 2px); width: 14px; cursor: pointer; opacity: 0; transition: opacity .35s var(--ease); }
.sbar:hover, .sbar.is-active { opacity: 1; }
.sbar[hidden] { display: none; }
.sbar::before { content: ''; position: absolute; top: 0; bottom: 0; right: 5px; width: 1px; background: color-mix(in srgb, var(--blue) 30%, transparent); }
.sbar-thumb { position: absolute; top: 0; right: 3px; width: 5px; border-radius: 6px; background: var(--blue); box-shadow: 0 0 0 1.5px var(--paper); cursor: grab; transition: width .25s var(--ease), right .25s var(--ease); }
.sbar:hover .sbar-thumb, .sbar.is-drag .sbar-thumb { width: 8px; right: 2px; }
@media (hover: none) { .sbar { pointer-events: none; } }

/* entrance of a view: words rise from a mask, blocks slide up, media unclip (paused under the curtain) */
.enter { animation: enterUp 1s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms + 80ms); }
.enter-mask { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em; }
.enter-word { display: inline-block; animation: wordUp 1.1s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms + 60ms); }
.enter-media { animation: mediaIn 1.4s var(--ease) both; animation-delay: 160ms; }
.enter-media > .dimg { animation: mediaScale 1.6s var(--ease) both; animation-delay: 160ms; }
@keyframes enterUp { from { opacity: 0; transform: translate3d(0, 36px, 0); } }
@keyframes wordUp { from { transform: translate3d(0, 105%, 0) rotate(2deg); } }
@keyframes mediaIn { from { clip-path: inset(22% 0 0 0); transform: translate3d(0, 40px, 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes mediaScale { from { transform: scale(1.18); } }
.is-covered :is(.enter, .enter-word, .enter-media, .enter-media > .dimg) { animation-play-state: paused; }

/* page curtain between two views */
.curtain { position: fixed; inset: 0; z-index: 98; display: grid; place-items: center; pointer-events: none; transform: translate3d(0, calc(100% + 160px), 0); visibility: hidden; }
.curtain.is-cover { visibility: visible; pointer-events: auto; animation: curtainIn .62s cubic-bezier(.76, 0, .24, 1) both; }
.curtain.is-reveal { visibility: visible; animation: curtainOut .95s cubic-bezier(.76, 0, .24, 1) both; }
@keyframes curtainIn { from { transform: translate3d(0, calc(100% + 160px), 0); } to { transform: none; } }
@keyframes curtainOut { from { transform: none; } to { transform: translate3d(0, calc(-100% - 160px), 0); } }
.curtain-dots { position: absolute; inset: -90px 0; background: radial-gradient(circle, var(--blue) 42%, transparent 46%) 0 0 / 14px 14px; -webkit-mask: linear-gradient(to bottom, transparent 0, #000 90px, #000 calc(100% - 90px), transparent 100%); mask: linear-gradient(to bottom, transparent 0, #000 90px, #000 calc(100% - 90px), transparent 100%); }
.curtain-inner { position: relative; display: grid; justify-items: center; gap: 18px; padding-inline: 24px; text-align: center; }
.curtain-title { overflow: hidden; padding-bottom: .06em; }
.curtain-title span { display: inline-block; }
.curtain.is-cover .curtain-title span { animation: wordUp .8s var(--ease) both .22s; }
.curtain.is-cover .label { animation: enterUp .6s var(--ease) both .2s; }
.curtain.is-reveal .curtain-inner { animation: curtainText .6s var(--ease-io) both; }
@keyframes curtainText { to { transform: translate3d(0, -60px, 0); opacity: 0; } }

/* ---------------------------------------------------------- images */
.dimg { position: relative; overflow: hidden; background: var(--blue); isolation: isolate; width: 100%; height: 100%; margin: 0; }
.dimg-layer { position: absolute; inset: 0; }
.parallax-layer { top: calc(var(--p, 0) * -100%); bottom: calc(var(--p, 0) * -100%); will-change: transform; }
.dimg img, .dimg canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dimg.is-contain img { object-fit: contain; }
.dimg canvas { opacity: 0; transition: opacity .6s var(--ease); }
.dimg.is-drawn canvas { opacity: 1; }
.dimg.fx-duotone img, .dimg.fx-dots img { filter: grayscale(1) contrast(1.12) brightness(1.04); mix-blend-mode: screen; }
.dimg.fx-dots.is-drawn img { opacity: 0; }
.dimg.fx-duotone .dimg-layer, .dimg.fx-dots .dimg-layer, .dimg.fx-placeholder .dimg-layer { background: var(--blue); }
.dimg.fx-none { background: var(--surface); }
.dimg-paper { position: absolute; inset: 0; pointer-events: none; background: url('paper.png') 0 0 / 300px 300px repeat; mix-blend-mode: multiply; opacity: .55; z-index: 1; }
.dimg.fx-none .dimg-paper { opacity: .28; }
.dimg .dimg-layer img.dimg-orig { z-index: 1; filter: none; mix-blend-mode: normal; opacity: 1; clip-path: circle(0% at var(--mx, 50%) var(--my, 50%)); transform: scale(1.06); transition: clip-path .42s cubic-bezier(.33, 1, .68, 1), transform .6s cubic-bezier(.33, 1, .68, 1); }
.dimg.is-revealed .dimg-layer img.dimg-orig { clip-path: circle(150% at var(--mx, 50%) var(--my, 50%)); transform: scale(1); }
.dimg.is-contain .dimg-layer img.dimg-orig { object-fit: contain; }
.dimg.can-reveal .dimg-paper { transition: opacity .35s var(--ease); }
.dimg.is-revealed .dimg-paper { opacity: .18; }
.work-intro { max-width: 60ch; margin: calc(-1 * clamp(12px, 2vw, 28px)) 0 clamp(36px, 5vw, 56px); }

/* ---------------------------------------------------------- header */
.site-header {
  --fg: var(--paper); --hdr-bg: var(--blue);
  background: var(--hdr-bg);
  position: fixed; inset: 0 0 auto; z-index: 50; color: var(--fg);
  padding-top: env(safe-area-inset-top, 0px);
  transition: background .35s var(--ease), color .35s var(--ease), transform .5s var(--ease), box-shadow .35s var(--ease);
}
.site-header.is-solid { --fg: var(--ink); --hdr-bg: var(--page); --line: var(--rule); box-shadow: 0 1px 0 var(--line); }
.site-header.is-hidden { transform: translateY(-110%); }
.header-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--gap); height: var(--header-h); transition: height .35s var(--ease); }
.is-solid .header-grid { height: 64px; }
.h-group { display: flex; align-items: center; gap: clamp(12px, 1.8vw, 28px); }
.h-links { flex: 1; display: flex; align-items: center; justify-content: space-around; gap: clamp(12px, 2vw, 32px); }
.h-right { justify-content: flex-end; }
.h-link { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0; border: 0; background: none; }
.h-ico { display: none; width: 20px; height: 20px; }
.h-lang { display: inline-flex; align-items: center; gap: 2px; height: 30px; padding: 2px 3px; border: 1px solid color-mix(in srgb, var(--fg) 45%, transparent); border-radius: 999px; background: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; transition: border-color .25s var(--ease); }
.h-lang:hover { border-color: var(--fg); }
.h-lang-opt { display: grid; place-items: center; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 999px; opacity: .6; transition: background .25s var(--ease), color .25s var(--ease), opacity .25s; }
.h-lang-opt.is-on { background: var(--fg); color: var(--hdr-bg); opacity: 1; }
.h-lang:hover .h-lang-opt:not(.is-on) { opacity: 1; }
@media (max-width: 639px) { .h-lang { margin-left: 2px; } .h-lang-opt { min-width: 22px; padding: 0 4px; } }
.h-logo { display: flex; flex-direction: column; align-items: center; border: 0; background: none; padding: 0; font-family: var(--font-display); font-weight: 300; font-size: clamp(22px, 2.3vw, 30px); line-height: .98; letter-spacing: -.01em; text-align: center; transition: font-size .35s var(--ease); }
.is-solid .h-logo { font-size: 21px; }
.h-cv { --btn-bg: var(--paper); --btn-fg: var(--blue); min-height: 36px; padding: 8px 12px; }
.h-cv:hover { --btn-bg: var(--white); }
.is-solid .h-cv { --btn-bg: var(--blue); --btn-fg: var(--paper); }
@media (max-width: 1023px) {
  .h-txt { display: none; }
  .h-ico { display: block; }
  .h-links { flex: none; gap: 4px; justify-content: flex-start; }
  .h-link { justify-content: center; min-width: 40px; }
  .h-cv { padding: 8px 10px; }
}
@media (max-width: 639px) {
  :root { --header-h: 68px; }
  .header-grid { display: flex; gap: 2px; }
  .h-logo { order: -1; margin-right: auto; align-items: flex-start; text-align: left; font-size: 19px; }
  .is-solid .h-logo { font-size: 17px; }
  .h-group, .h-links { gap: 2px; }
  .h-link { min-width: 36px; }
  .h-ico { width: 19px; height: 19px; }
  .h-cv { min-height: 34px; padding: 7px 9px; margin-left: 4px; }
  .is-solid .header-grid { height: 58px; }
}

/* ---------------------------------------------------------- shared bits */
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px 40px; flex-wrap: wrap; margin-bottom: clamp(36px, 5vw, 64px); }
.section-index { margin-bottom: 14px; color: var(--muted); }
.section-head-aside { padding-bottom: 8px; }
.pixel-glyph { width: .28em; height: .28em; fill: currentColor; display: inline-block; vertical-align: top; margin-left: .12em; margin-top: .08em; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------------------------------------------------------- hero */
.hero {
  position: relative; overflow: hidden;
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + var(--header-h) + clamp(28px, 5vw, 64px));
  padding-bottom: clamp(56px, 7vw, 96px);
}
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: center; gap: clamp(32px, 5vw, 80px); }
.hero-text { min-width: 0; }
.hero-kicker { display: flex; align-items: center; gap: 10px; margin-bottom: clamp(20px, 3vw, 32px); }
.hero-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, var(--paper) 18%, transparent); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px transparent; } }
.hero-title { margin-bottom: clamp(20px, 3vw, 30px); }
.hero-intro { max-width: 52ch; margin-bottom: 28px; font-size: clamp(15px, 1.15vw, 17px); color: color-mix(in srgb, var(--paper) 88%, var(--blue)); }
.hero-intro strong { color: var(--white); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: clamp(32px, 4vw, 48px); }
.hero-media { position: relative; aspect-ratio: 9 / 10; max-height: 76vh; width: 100%; max-width: 100%; justify-self: end; }
.hero-media .dimg { border-radius: var(--radius); }
@media (max-width: 1023px) { .hero-grid { grid-template-columns: 1fr; } .hero-media { aspect-ratio: 4 / 3; max-height: none; } }
@media (max-width: 639px) { .hero-media { aspect-ratio: 1; } }
/* ---------------------------------------------------------- work */
.work-grid { row-gap: clamp(48px, 6vw, 88px); }
.work-grid.is-changing .pcard { animation: viewIn .5s var(--ease) both; }
.work-empty { padding: 40px 0; color: var(--muted); }
.pcard { min-width: 0; }
.pcard.c-2 { grid-column: span 2; }
.pcard.c-3 { grid-column: 1 / -1; }
.pcard-link { display: flex; flex-direction: column; height: 100%; }
.pcard-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 14px; color: var(--muted); }
.pcard-meta span:first-child { color: var(--fg); }
.pcard-meta span.pcard-top { display: inline-flex; align-items: center; gap: 6px; margin: -3px 0; padding: 3px 7px 2px; background: var(--blue); color: var(--paper); border-radius: var(--radius); }
.pcard-top .pixel-glyph, .chip-top .pixel-glyph { width: 9px; height: 9px; margin: 0; }

<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.27/dist/lenis.min.js"></script>
<script>
(() => {
  'use strict'
  const DATA = JSON.parse(document.getElementById('portfolio-data').textContent)
  const ICONS = /*__ICONS__*/
  const S = DATA.settings
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches

  /* ------------------------------------------------------------ i18n */
  const UI = {
    fr: {
      work: 'Réalisations', about: 'À propos', skills: 'Compétences', contact: 'Contact', cv: 'Mon CV', home: 'Accueil',
      lang: 'English', langShort: 'EN', cta: 'Voir mes réalisations', cvLong: 'Voir mon CV', scroll: 'Défiler',
      workTitle: 'Réalisations', all: 'Tout', filter: 'Filtrer', empty: 'Aucun projet dans cette catégorie pour le moment.',
      open: 'Voir le projet', aboutTitle: 'Qui suis-je ?', skillsTitle: 'Compétences', contactTitle: 'Contact',
      back: 'Toutes les réalisations', year: 'Année', category: 'Catégorie', tools: 'Outils', visit: 'Voir le projet en ligne',
      next: 'Projet suivant', prev: 'Projet précédent', made: 'Réalisé par', rights: 'Tous droits réservés',
      top: 'Haut de page', close: 'Fermer', play: 'Lire la vidéo', zoom: 'Afficher en grand',
      method: 'Méthode', services: 'Savoir-faire', me: 'Moi', ai: "Avec l'IA",
      highlights: 'Sélection', rank: 'Top', email: 'Email', copy: "Copier l'adresse", copied: 'Adresse copiée !', copyFail: "Sélectionne l'adresse",
    },
    en: {
      work: 'Work', about: 'About', skills: 'Skills', contact: 'Contact', cv: 'Resume', home: 'Home',
      lang: 'Français', langShort: 'FR', cta: 'See my work', cvLong: 'View my resume', scroll: 'Scroll',
      workTitle: 'Selected work', all: 'All', filter: 'Filter', empty: 'No project in this category yet.',
      open: 'Open project', aboutTitle: 'Who am I?', skillsTitle: 'Skills', contactTitle: 'Contact',
      back: 'All projects', year: 'Year', category: 'Category', tools: 'Tools', visit: 'Visit the project',
      next: 'Next project', prev: 'Previous project', made: 'Made by', rights: 'All rights reserved',
      top: 'Back to top', close: 'Close', play: 'Play video', zoom: 'View larger',
      method: 'Method', services: 'What I do', me: 'Me', ai: 'With AI',
      highlights: 'Highlights', rank: 'Top', email: 'Email', copy: 'Copy the address', copied: 'Address copied!', copyFail: 'Select the address',
    },
  }
  // language: the visitor's previous choice, otherwise their browser language (French or English)
  let lang = 'fr'
  let stored = null
  try { stored = localStorage.getItem('mv-lang') } catch (e) {}
  if (stored === 'en' || stored === 'fr') lang = stored
  else {
    const prefs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'fr'])
    lang = String(prefs[0] || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en'
  }
  const t = (k) => UI[lang][k] ?? UI.fr[k] ?? k
  const tr = (v) => (!v ? '' : v[lang] && v[lang].trim() ? v[lang] : v.fr || v.en || '')
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  const icon = (name, cls = '') => (ICONS[name] || '').replace('<svg', `<svg class="ico ${cls}" aria-hidden="true"`)
  const pad = (n) => String(n).padStart(2, '0')
  const M = (id) => (id && DATA.media[id]) || null

  function inline(src) {
    let s = esc(src)
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_m, label, url) => {
      const u = url.replace(/&amp;/g, '&')
      if (!/^https?:/i.test(u)) return label
      return `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`
    })
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    return s.replace(/\n/g, '<br>')
  }
  function rich(src) {
    if (!src) return ''
    return src.replace(/\r\n/g, '\n').split(/\n{2,}/).map((p) => p.trim()).filter(Boolean).map((p) => {
      const lines = p.split('\n')
      if (lines.every((l) => /^\s*[-•]\s+/.test(l))) return `<ul>${lines.map((l) => `<li>${inline(l.replace(/^\s*[-•]\s+/, ''))}</li>`).join('')}</ul>`
      return `<p>${inline(p)}</p>`
    }).join('')
  }
  const words = (text, from = 0) => (text || '').split(/\s+/).filter(Boolean)
    .map((w, i) => `<span class="enter-mask" aria-hidden="true"><span class="enter-word" style="--i:${i + from}">${esc(w)}</span></span>`).join(' ')
  const plain = (src) => (src || '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\*\*?([^*]+)\*\*?/g, '$1').replace(/\s+/g, ' ').trim()

  /* ------------------------------------------------------------ glyphs */
  const GLYPHS = {
    eye: ['..###..', '.#...#.', '#..#..#', '#.###.#', '#..#..#', '.#...#.', '..###..'],
    star: ['...#...', '...#...', '.#.#.#.', '#######', '.#.#.#.', '...#...', '...#...'],
    chip: ['.#.#.#.', '#######', '.#...#.', '##.#.##', '.#...#.', '#######', '.#.#.#.'],
    spark: ['#.....#', '.#...#.', '..#.#..', '...#...', '..#.#..', '.#...#.', '#.....#'],
    grid: ['##.##.#', '##.##.#', '.......', '##.##.#', '##.##.#', '.......', '##.##.#'],
    mail: ['#######', '##...##', '#.#.#.#', '#..#..#', '#.....#', '#.....#', '#######'],
  }
  const glyph = (name) => {
    let c = ''
    GLYPHS[name].forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '#') c += `<circle cx="${x + 0.5}" cy="${y + 0.5}" r="0.42"/>` }))
    return `<svg class="pixel-glyph" viewBox="0 0 7 7" aria-hidden="true">${c}</svg>`
  }
  const sectionHead = (index, title, g, aside = '') => `
    <header class="section-head">
      <div><p class="label section-index">(${index})</p><h2 class="display-l">${esc(title)}${glyph(g)}</h2></div>
      ${aside ? `<div class="section-head-aside">${aside}</div>` : ''}
    </header>`

  /* ------------------------------------------------------------ images */
  function dotImage({ media = null, effect = 'none', alt = '', parallax = 0, fit = 'cover', seed = 'mv', sizes = '100vw', eager = false, paper = true, reveal = false, revealOn = 'self' }) {
    const isImg = media && media.kind === 'image'
    const fx = isImg ? effect : 'placeholder'
    const canvas = !isImg || effect === 'dots'
    const canReveal = reveal && isImg && effect !== 'none'
    const p = parallax > 0 ? ` parallax-layer" data-parallax="${parallax}" style="--p:${parallax}` : ''
    return `<figure class="dimg fx-${fx}${fit === 'contain' ? ' is-contain' : ''}${canReveal ? ' can-reveal' : ''}" data-reveal-on="${revealOn}" data-seed="${esc(seed)}" data-fit="${fit}" data-canvas="${canvas ? 1 : 0}">
      <div class="dimg-layer${p}">
        ${isImg ? `<img src="${esc(media.url)}"${media.srcset ? ` srcset="${esc(media.srcset)}" sizes="${esc(sizes)}"` : ''}${media.width ? ` width="${media.width}" height="${media.height}"` : ''} alt="${esc(alt)}" loading="${eager ? 'eager' : 'lazy'}" decoding="async" draggable="false">` : ''}
        ${canvas ? '<canvas aria-hidden="true"></canvas>' : ''}
        ${canReveal ? `<img class="dimg-orig" src="${esc(media.url)}"${media.srcset ? ` srcset="${esc(media.srcset)}" sizes="${esc(sizes)}"` : ''} alt="" aria-hidden="true" loading="lazy" decoding="async" draggable="false">` : ''}
        ${!isImg && alt ? `<span class="sr-only">${esc(alt)}</span>` : ''}
      </div>
      ${paper ? '<div class="dimg-paper" aria-hidden="true"></div>' : ''}
    </figure>`
  }

  function hashString(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0 }
  function makeNoise(seed) {
    const perm = new Uint8Array(512); let x = seed || 1
    const p = Array.from({ length: 256 }, (_, i) => i)
    for (let i = 255; i > 0; i--) { x = (x * 1103515245 + 12345) & 0x7fffffff; const j = x % (i + 1); [p[i], p[j]] = [p[j], p[i]] }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255]
    const fade = (t) => t * t * (3 - 2 * t)
    const v = (i, j) => perm[(perm[i & 255] + j) & 511] / 255
    const noise = (x, y) => {
      const i = Math.floor(x), j = Math.floor(y), fx = fade(x - i), fy = fade(y - j)
      const a = v(i, j), b = v(i + 1, j), c = v(i, j + 1), d = v(i + 1, j + 1)
      return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy
    }
    return (x, y) => noise(x, y) * 0.55 + noise(x * 2.1, y * 2.1) * 0.3 + noise(x * 4.3, y * 4.3) * 0.15
  }
  function placeholderField(seedStr) {
    const h = hashString(seedStr), n = makeNoise(h)
    const forced = ['globe', 'dunes', 'field'].findIndex((k) => seedStr.startsWith(k))
    const variant = forced >= 0 ? forced : h % 3
    if (variant === 0) {
      return (u, v, aspect) => {
        const x = (u - 0.5) * aspect, y = v - 0.5, d = Math.hypot(x, y), R = 0.3
        if (d < R) {
          const nx = x / R, ny = y / R, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny))
          const light = Math.max(0, -nx * 0.5 - ny * 0.55 + nz * 0.67)
          const lat = Math.asin(ny), lon = Math.atan2(nx, nz) + 0.35
          const grid = Math.max(Math.pow(Math.abs(Math.cos(lat * 6)), 70), Math.pow(Math.abs(Math.cos(lon * 6)), 70) * nz)
          const rim = Math.pow(1 - nz, 6) * 0.9
          return Math.min(1, 0.1 + light * 0.75 + grid * 0.42 + rim + (n(u * 9, v * 9) - 0.5) * 0.35)
        }
        const a = Math.atan2(y, x)
        const rays = Math.pow(Math.max(0, Math.sin(a * 34 + n(u * 2, v * 2) * 3)), 10)
        return Math.max(0, rays * Math.max(0, 1 - (d - R) * 2.4) * 0.8 + Math.max(0, 1 - (d - R) * 14) * 0.5 - 0.04)
      }
    }
    if (variant === 1) {
      const k = 2 + (h % 4)
      return (u, v) => Math.max(0, Math.sin((v * k + n(u * 3, v * 2) * 1.8) * Math.PI * 2) * 0.5 + 0.5) * (0.35 + v * 0.75) - 0.12
    }
    return (u, v) => Math.max(0, Math.min(1, (n(u * 3.2 + 10, v * 3.2) - 0.32) * 2.1))
  }

  function drawDots(fig) {
    const c = fig.querySelector('canvas'), box = fig.querySelector('.dimg-layer'), image = fig.querySelector('img:not(.dimg-orig)')
    if (!c || !box) return
    const W0 = box.clientWidth, H0 = box.clientHeight
    if (!W0 || !H0) return
    const dpr = Math.min(window.devicePixelRatio || 1, 2)
    const W = Math.round(W0 * dpr), H = Math.round(H0 * dpr)
    c.width = W; c.height = H
    const ctx = c.getContext('2d'); if (!ctx) return
    const step = Math.max(4, Math.min(9, W0 / 125)) * dpr, rs = step * 0.866
    const cols = Math.ceil(W / step) + 1, rows = Math.ceil(H / rs) + 1
    let lum
    if (image && image.naturalWidth) {
      const sc = document.createElement('canvas'); sc.width = cols; sc.height = rows
      const sctx = sc.getContext('2d', { willReadFrequently: true })
      sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high'
      const iw = image.naturalWidth, ih = image.naturalHeight
      const scale = fig.dataset.fit === 'contain' ? Math.min(W / iw, H / ih) : Math.max(W / iw, H / ih)
      const dw = iw * scale, dh = ih * scale
      sctx.drawImage(image, ((W - dw) / 2) / step, ((H - dh) / 2) / rs, dw / step, dh / rs)
      let data
      try { data = sctx.getImageData(0, 0, cols, rows).data } catch (e) { return }
      const L = new Float32Array(cols * rows), sample = []
      for (let k = 0; k < cols * rows; k++) {
        const a = data[k * 4 + 3] / 255
        const l = ((0.2126 * data[k * 4] + 0.7152 * data[k * 4 + 1] + 0.0722 * data[k * 4 + 2]) / 255) * a
        L[k] = l
        if (a > 0.5 && k % 3 === 0) sample.push(l)
      }
      sample.sort((a, b) => a - b)
      const lo = sample[Math.floor(sample.length * 0.02)] ?? 0, hi = sample[Math.floor(sample.length * 0.98)] ?? 1
      const range = Math.max(0.15, hi - lo)
      lum = (i, j) => Math.min(1, Math.max(0, ((L[j * cols + i] ?? 0) - lo) / range))
    } else {
      const field = placeholderField(fig.dataset.seed || 'mv'), aspect = W / H
      lum = (i, j) => field((i * step) / W, (j * rs) / H, aspect)
    }
    ctx.fillStyle = '#0037ff'; ctx.fillRect(0, 0, W, H)
    ctx.fillStyle = '#f4f3ff'; ctx.beginPath()
    const maxR = step * 0.56, minR = 0.45 * dpr
    for (let j = 0; j < rows; j++) {
      const y = (j + 0.5) * rs, off = j % 2 ? step / 2 : 0
      for (let i = 0; i < cols; i++) {
        const r = Math.pow(lum(i, j), 1.1) * maxR
        if (r < minR) continue
        const x = (i + 0.5) * step + off
        ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2)
      }
    }
    ctx.fill()
    fig.classList.add('is-drawn')
  }

  let observers = []
  function mountImages(root) {
    root.querySelectorAll('figure.dimg[data-canvas="1"]').forEach((fig) => {
      let visible = false, raf = 0, lastW = 0, lastH = 0, timer
      const img = fig.querySelector('img:not(.dimg-orig)'), layer = fig.querySelector('.dimg-layer')
      const schedule = () => { if (!visible) return; cancelAnimationFrame(raf); raf = requestAnimationFrame(() => drawDots(fig)) }
      if (img) img.addEventListener('load', schedule)
      const io = new IntersectionObserver((es) => {
        if (es.some((e) => e.isIntersecting)) { visible = true; io.disconnect(); if (!img || img.complete) schedule() }
      }, { rootMargin: '300px' })
      io.observe(fig)
      const ro = new ResizeObserver(() => {
        if (Math.abs(layer.clientWidth - lastW) < 2 && Math.abs(layer.clientHeight - lastH) < 2) return
        lastW = layer.clientWidth; lastH = layer.clientHeight
        clearTimeout(timer); timer = setTimeout(schedule, fig.classList.contains('is-drawn') ? 140 : 0)
      })
      ro.observe(layer)
      observers.push(io, ro)
    })
    const revealAt = (fig, e, on) => {
      if (e.pointerType !== 'mouse') return
      const r = fig.getBoundingClientRect()
      fig.style.setProperty('--mx', `${(((e.clientX - r.left) / r.width) * 100).toFixed(1)}%`)
      fig.style.setProperty('--my', `${(((e.clientY - r.top) / r.height) * 100).toFixed(1)}%`)
      fig.classList.toggle('is-revealed', on)
    }
    root.querySelectorAll('figure.dimg.can-reveal[data-reveal-on="self"]').forEach((fig) => {
      fig.addEventListener('pointerenter', (e) => revealAt(fig, e, true))
      fig.addEventListener('pointerleave', (e) => revealAt(fig, e, false))
    })
    // the "next project" card reveals its image when hovered anywhere
    root.querySelectorAll('.proj-next-link').forEach((card) => {
      const fig = card.querySelector('figure.dimg.can-reveal')
      if (!fig) return
      card.addEventListener('pointerenter', (e) => revealAt(fig, e, true))
      card.addEventListener('pointerleave', (e) => revealAt(fig, e, false))
    })
    root.querySelectorAll('.vid').forEach((box) => {
      const v = box.querySelector('video')
      const custom = box.classList.contains('is-custom')
      v.addEventListener('play', () => box.classList.add('is-playing'))
      v.addEventListener('pause', () => box.classList.remove('is-playing'))
      // hover: original colours drawn from the same <video> on a canvas, revealed in a circle
      const c = box.querySelector('canvas.vid-orig')
      if (c) {
        let raf = 0, on = false, stopAt = 0
        const draw = () => {
          if (v.videoWidth) {
            const dpr = Math.min(window.devicePixelRatio || 1, 2), W = Math.round(box.clientWidth * dpr), H = Math.round(box.clientHeight * dpr)
            if (c.width !== W || c.height !== H) { c.width = W; c.height = H }
            const ctx = c.getContext('2d'), vw = v.videoWidth, vh = v.videoHeight
            const sc = box.classList.contains('is-contain') ? Math.min(W / vw, H / vh) : Math.max(W / vw, H / vh)
            ctx.clearRect(0, 0, W, H); ctx.drawImage(v, (W - vw * sc) / 2, (H - vh * sc) / 2, vw * sc, vh * sc)
          }
          raf = on || performance.now() < stopAt ? requestAnimationFrame(draw) : 0
        }
        const at = (e, state) => {
          if (e.pointerType !== 'mouse') return
          const r = box.getBoundingClientRect()
          box.style.setProperty('--mx', `${(((e.clientX - r.left) / r.width) * 100).toFixed(1)}%`)
          box.style.setProperty('--my', `${(((e.clientY - r.top) / r.height) * 100).toFixed(1)}%`)
          on = state; box.classList.toggle('is-revealed', state)
          if (state) { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw) } else stopAt = performance.now() + 600
        }
        box.addEventListener('pointerenter', (e) => at(e, true))
        box.addEventListener('pointerleave', (e) => at(e, false))
      }
      if (!custom) return
      const io = new IntersectionObserver(([e]) => { if (e && e.isIntersecting) v.play().catch(() => {}); else v.pause() }, { threshold: 0.35 })
      io.observe(v)
      observers.push(io)
      box.addEventListener('click', (e) => { if (e.target.closest('[data-zoom]')) return; v.paused ? v.play().catch(() => {}) : v.pause() })
    })
    collectParallax()
  }

  /* ------------------------------------------------------------ parallax + smooth scroll */
  let layers = []
  function collectParallax() { layers = reduceMotion ? [] : [...document.querySelectorAll('.parallax-layer[data-parallax]')]; requestParallax() }
  let ticking = false
  function updateParallax() {
    ticking = false
    const vh = window.innerHeight
    for (const el of layers) {
      const host = el.parentElement; if (!host) continue
      const r = host.getBoundingClientRect()
      if (r.bottom < -200 || r.top > vh + 200) continue
      const progress = (r.top + r.height / 2 - vh / 2) / (vh / 2 + r.height / 2)
      el.style.transform = `translate3d(0, ${(Math.max(-1, Math.min(1, progress)) * Number(el.dataset.parallax) * r.height).toFixed(2)}px, 0)`
    }
  }
  function requestParallax() { if (!ticking) { ticking = true; requestAnimationFrame(updateParallax) } }

  let lenis = null
  if (window.Lenis && !reduceMotion) {
    try { lenis = new window.Lenis({ autoRaf: true, lerp: 0.095, smoothWheel: true }) } catch (e) { lenis = null }
  }
  function scrollToTarget(target, immediate = false) {
    if (lenis) { lenis.resize(); lenis.scrollTo(target, { immediate, duration: 1.4, force: true }); return }
    const y = typeof target === 'number' ? target : target.getBoundingClientRect().top + window.scrollY
    window.scrollTo({ top: y, behavior: immediate || reduceMotion ? 'auto' : 'smooth' })
  }

  /* ------------------------------------------------------------ header / footer */
  const header = document.getElementById('header')
  const footer = document.getElementById('footer')
  const main = document.getElementById('main')
  let view = 'home'
  let activeSection = ''
  const nameParts = () => { const p = (S.name || '').trim().split(/\s+/); return p.length > 1 ? [p[0], p.slice(1).join(' ')] : p }

  function renderHeader() {
    const link = (id, ic) => `<button type="button" class="h-link" data-nav="${id}" title="${esc(t(id))}" aria-label="${esc(t(id))}">${icon(ic, 'h-ico')}<span class="h-txt nav-label link-underline${view === 'home' && activeSection === id ? ' is-active' : ''}">${esc(t(id))}</span></button>`
    const ICON = { work: 'layout-grid', about: 'user-round', method: 'workflow', services: 'wand-sparkles', skills: 'sparkles', contact: 'mail' }
    const navs = sections().map((x) => link(x.id, ICON[x.id]))
    const half = Math.ceil(navs.length / 2)
    header.innerHTML = `<div class="wrap header-grid">
      <nav class="h-group h-left" aria-label="${esc(t('home'))}"><span class="h-links">${navs.slice(0, half).join('')}</span></nav>
      <button type="button" class="h-logo" data-nav="top" aria-label="${esc(S.name)} — ${esc(t('home'))}">${nameParts().map((p) => `<span>${esc(p)}</span>`).join('')}</button>
      <nav class="h-group h-right" aria-label="Menu">
        <span class="h-links">${navs.slice(half).join('')}</span>
        <button type="button" class="h-lang" data-lang title="${esc(t('lang'))}" aria-label="${esc(t('lang'))}"><span class="h-lang-opt${lang === 'fr' ? ' is-on' : ''}">FR</span><span class="h-lang-opt${lang === 'en' ? ' is-on' : ''}">EN</span></button>
        ${DATA.cvUrl ? `<a class="btn h-cv" href="${esc(DATA.cvUrl)}" target="_blank" rel="noopener" title="${esc(t('cvLong'))}">${icon('download')}<span class="h-txt">${esc(t('cv'))}</span></a>` : ''}
      </nav>
    </div>`
  }

  function renderFooter() {
    const parts = (S.name || '').trim().split(/\s+/)
    const iconFor = (url) => (/linkedin/i.test(url) ? 'linkedin' : /github/i.test(url) ? 'github' : /instagram/i.test(url) ? 'instagram' : 'globe')
    footer.innerHTML = `<div class="footer-mark" aria-hidden="true">${esc(parts[parts.length - 1])}</div>
      <div class="wrap footer-grid">
        <div class="footer-col"><p class="nav-label">${esc(S.name)} — Portfolio</p><p class="label muted">© ${new Date().getFullYear()} · ${esc(t('rights'))}</p></div>
        <ul class="footer-socials">${(S.socials || []).map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${esc(s.label)}" title="${esc(s.label)}">${icon(iconFor(s.url))}</a></li>`).join('')}</ul>
        <div class="footer-col footer-right">

    switch (b.type) {
      case 'heading':
        return `<div class="${cls}">${b.level === 3 ? `<h3 class="display-m">${esc(tr(b.text))}</h3>` : `<h2 class="display-l">${esc(tr(b.text))}</h2>`}</div>`
      case 'text':
        return `<div class="${cls}"><div class="rich${b.variant === 'lead' ? ' lead' : ''}">${rich(tr(b.text))}</div></div>`
      case 'quote':
        return `<div class="${cls}"><blockquote class="blk-quote"><span class="blk-quote-mark" aria-hidden="true">“</span><div class="rich display-s">${rich(tr(b.text))}</div></blockquote></div>`
      case 'link': {
        if (!b.url) return ''

        try { host = new URL(b.url).hostname.replace(/^www\./, '') } catch (e) {}
        return `<div class="${cls}"><a class="blk-linkbox" href="${esc(b.url)}" target="_blank" rel="noopener"><span class="label muted">${esc(host || 'Lien')}</span><span class="display-s">${esc(tr(b.text) || b.url)}</span>${icon('arrow-up-right', 'blk-link-arrow')}</a></div>`
      }
      case 'divider':
        return `<div class="${cls}"><hr class="blk-hr"></div>`
      case 'image':
        return `<div class="${cls}" style="--ar:${ar}"><figure class="blk-fig">
          ${m ? `<button type="button" class="blk-media blk-zoom" data-zoom="${esc(b.id)}" aria-label="${esc(cap || tr(m.alt) || 'Image')}">${dotImage({ media: m, effect: b.effect, fit: b.fit, alt: tr(m.alt) || cap, parallax: b.row > 1 ? 0.14 : 0.1, sizes, seed: b.id, reveal: true })}<span class="blk-zoom-ico" aria-hidden="true">${icon('maximize-2')}</span></button>`
            : `<div class="blk-media">${dotImage({ seed: b.id })}</div>`}
          ${cap ? `<figcaption class="label">${esc(cap)}</figcaption>` : ''}</figure></div>`
      case 'video': {

            <div class="dimg-paper" aria-hidden="true"></div>

          </div>` : dotImage({ seed: b.id })
        return `<div class="${cls}" style="--ar:${ar}"><figure class="blk-fig"><div class="blk-media">${inner}</div>${cap ? `<figcaption class="label">${esc(cap)}</figcaption>` : ''}</figure></div>`

  /* ------------------------------------------------------------ lightbox */
  let gallery = []

  const lbRoot = document.getElementById('lightbox-root')
  function lbMedia(it) {
    return it.media.kind === 'video'
      ? `<video class="lb-media" src="${esc(it.media.url)}" controls autoplay playsinline aria-label="${esc(it.caption)}"></video>`
      : `<img class="lb-media" src="${esc(it.media.url)}"${it.media.srcset ? ` srcset="${esc(it.media.srcset)}" sizes="100vw"` : ''} alt="${esc(tr(it.media.alt) || it.caption)}" decoding="async">`
  }
  /* halftone background: round pixels growing from a calm centre to the edges */
  function drawHalftone(c) {
    const w = c.parentElement.clientWidth, h = c.parentElement.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2)
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr)
    const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height)
    ctx.fillStyle = 'rgba(244, 243, 255, .32)'; ctx.beginPath()
    const step = 16 * dpr, rowH = step * 0.866, maxR = step * 0.44
    const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t) }
    for (let j = 0, y = rowH / 2; y < c.height + rowH; j++, y += rowH) {
      for (let x = j % 2 ? step / 2 : 0; x < c.width + step; x += step) {
        const u = (x / c.width - 0.5) * 2, v = (y / c.height - 0.5) * 2
        const r = smooth(0.32, 1.02, Math.hypot(u * 0.92, v) / Math.SQRT2) * maxR
        if (r < 0.5 * dpr) continue
        ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2)
      }
    }
    ctx.fill()
  }
  let lbDir = 1
  function renderLightbox() {
    if (lbIndex < 0) { lbRoot.innerHTML = ''; return }
    const it = gallery[lbIndex]
    const count = `<span class="lb-num">${pad(lbIndex + 1)}</span> / ${pad(gallery.length)}${it.caption ? ` — ${esc(it.caption)}` : ''}`
    const shell = lbRoot.querySelector('.lightbox')
    if (shell) {
      // change of media: halftone dissolve + small drift in the direction of travel
      const frame = shell.querySelector('.lb-frame')
      const side = lbDir > 0 ? 'next' : 'prev'
      frame.querySelectorAll('.lb-media').forEach((old) => {
        if (old.classList.contains('is-leaving')) return old.remove()
        old.classList.add('is-leaving', 'lb-dots', 'lb-still') // full dots at once, then they shrink
        if (old.tagName === 'VIDEO') old.pause()
        requestAnimationFrame(() => requestAnimationFrame(() => { old.classList.remove('lb-still'); old.classList.add('lb-dots-0', `lb-to-${side}`) }))
        setTimeout(() => old.remove(), 850)
      })
      frame.insertAdjacentHTML('beforeend', lbMedia(it))
      const fresh = frame.lastElementChild
      fresh.classList.add('lb-dots', 'lb-dots-0', `lb-from-${side}`, 'lb-still')
      requestAnimationFrame(() => requestAnimationFrame(() => {
        fresh.classList.remove('lb-still', 'lb-dots-0', `lb-from-${side}`)
        setTimeout(() => fresh.classList.remove('lb-dots'), 850)
      }))
      shell.querySelector('.lb-count').innerHTML = count
      const num = shell.querySelector('.lb-num'); num.classList.add(lbDir > 0 ? 'from-below' : 'from-above')
      requestAnimationFrame(() => requestAnimationFrame(() => num.classList.remove('from-below', 'from-above')))
      return
    }
    lbRoot.innerHTML = `<div class="lightbox tone-blue" role="dialog" aria-modal="true" data-lenis-prevent data-lb-bg>
      <div class="lb-ambient" aria-hidden="true"><canvas class="halftone"></canvas></div>
      <div class="lb-frame" data-lb-bg>${lbMedia(it)}</div>
      <div class="lb-bar">
        <p class="label lb-count">${count}</p>
        <div class="lb-actions">
          ${gallery.length > 1 ? `<button type="button" class="btn btn-ghost" data-lb="-1" aria-label="${esc(t('prev'))}">${icon('arrow-left')}</button><button type="button" class="btn btn-ghost" data-lb="1" aria-label="${esc(t('next'))}">${icon('arrow-right')}</button>` : ''}
          <button type="button" class="btn btn-solid" data-lb="close">${icon('x')} ${esc(t('close'))}</button>
        </div>
      </div>
    </div>`
    drawHalftone(lbRoot.querySelector('canvas.halftone'))
  }
  window.addEventListener('resize', () => { const c = lbRoot.querySelector('canvas.halftone'); if (c) drawHalftone(c) }, { passive: true })
  function openLightbox(id) { const i = gallery.findIndex((g) => g.id === id); if (i < 0) return; lbIndex = i; lenis && lenis.stop(); document.documentElement.style.overflow = 'hidden'; renderLightbox() }
  function closeLightbox() { lbIndex = -1; lenis && lenis.start(); document.documentElement.style.overflow = ''; renderLightbox() }
  function moveLightbox(d) { lbDir = d >= 0 ? 1 : -1; lbIndex = (lbIndex + d + gallery.length) % gallery.length; renderLightbox() }

  /* ------------------------------------------------------------ sections, routing, events */
  let sectionIO = null
  function watchSections() {
    sectionIO && sectionIO.disconnect()
    sectionIO = new IntersectionObserver((es) => {
      for (const e of es) if (e.isIntersecting) {
        activeSection = e.target.id
        header.querySelectorAll('[data-nav] .h-txt').forEach((s) => s.classList.toggle('is-active', s.parentElement.dataset.nav === activeSection))
      }
    }, { rootMargin: '-45% 0px -50% 0px' })
    main.querySelectorAll('section[data-section]').forEach((s) => sectionIO.observe(s))
  }

  /* blue curtain between two views; the entrance animations wait under it */
  const curtainEl = document.getElementById('curtain')
  let firstRoute = true
  function withCurtain(fn) {
    if (firstRoute || reduceMotion) { firstRoute = false; fn(); return }
    const slug = decodeURIComponent(location.hash.slice(1))
    const i = DATA.projects.findIndex((p) => p.slug === slug)
    const p = DATA.projects[i]
    document.getElementById('curtain-label').textContent = p ? `(${pad(i + 1)})${p.year ? ` — ${p.year}` : ''}` : 'Portfolio'
    document.getElementById('curtain-title').textContent = p ? tr(p.title) : S.name
    curtainEl.className = 'curtain tone-blue is-cover'
    document.documentElement.classList.add('is-covered')
    setTimeout(() => {
      fn()
      setTimeout(() => {
        curtainEl.className = 'curtain tone-blue is-reveal'
        document.documentElement.classList.remove('is-covered')
        setTimeout(() => { curtainEl.className = 'curtain tone-blue' }, 1000)
      }, 140)
    }, 620)
  }

  let pendingSection = null
  function route(keepScroll = false) {
    observers.forEach((o) => o.disconnect()); observers = []
    const slug = decodeURIComponent(location.hash.slice(1))
    const project = DATA.projects.find((p) => p.slug === slug)
    const y = window.scrollY
    if (project) {
      renderProject(project)
      if (sectionIO) sectionIO.disconnect()
      activeSection = ''
    } else renderHome()
    renderHeader()
    renderFooter()
    if (keepScroll) { scrollToTarget(y, true); return }
    if (pendingSection) {
      const el = document.getElementById(pendingSection); pendingSection = null
      requestAnimationFrame(() => el ? scrollToTarget(el, true) : scrollToTarget(0, true))
    } else scrollToTarget(0, true)
  }

  function goSection(id) {
    if (id === 'top') { if (view === 'home') scrollToTarget(0); else { pendingSection = null; location.hash = '' } return }
    if (view === 'home') { const el = document.getElementById(id); if (el) scrollToTarget(el); return }
    pendingSection = id
    location.hash = ''
  }

  /* juicy copy: blue fill sweeping the row, letters bouncing, burst of round pixels, bubble */
  let copyTimers = []
  function copyEmail(row) {
    const addr = row.querySelector('.copy-addr')
    const ok = (good) => {
      copyTimers.forEach(clearTimeout)
      row.classList.remove('is-in', 'is-out'); void row.offsetWidth; row.classList.add('is-in')
      row.querySelector('.copy-live').textContent = good ? t('copied') : t('copyFail')
      const ico = row.querySelector('.copy-ico')
      ico.querySelectorAll('.copy-bubble').forEach((b) => b.remove())
      const bubble = document.createElement('span'); bubble.className = 'copy-bubble'; bubble.textContent = good ? t('copied') : t('copyFail')
      ico.appendChild(bubble)
      const burst = document.createElement('span'); burst.className = 'copy-burst'
      for (let i = 0; i < 18; i++) {
        const a = (i / 18) * Math.PI * 2 + Math.random() * 0.35, r = 30 + Math.random() * 46
        const d = document.createElement('i')
        d.style.cssText = `--dx:${(Math.cos(a) * r).toFixed(1)}px;--dy:${(Math.sin(a) * r).toFixed(1)}px;--s:${(0.45 + Math.random() * 0.9).toFixed(2)};--d:${Math.round(Math.random() * 90)}ms`
        burst.appendChild(d)
      }
      ico.appendChild(burst)
      copyTimers = [
        setTimeout(() => { burst.remove() }, 1100),
        setTimeout(() => { row.classList.add('is-out') }, 1150),
        setTimeout(() => { row.classList.remove('is-in', 'is-out'); bubble.remove() }, 1700),
      ]
    }
    const select = () => { const r = document.createRange(); r.selectNodeContents(addr); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r) }
    try { navigator.clipboard.writeText(row.dataset.copy).then(() => ok(true), () => { select(); ok(false) }) } catch (err) { select(); ok(false) }
  }

  document.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]')
    if (nav) { e.preventDefault(); pinHeader(); goSection(nav.dataset.nav); return }
    if (e.target.closest('[data-lang]')) {
      lang = lang === 'fr' ? 'en' : 'fr'
      try { localStorage.setItem('mv-lang', lang) } catch (err) {}
      document.documentElement.lang = lang
      withCurtain(() => route(true))
      return
    }
    const f = e.target.closest('[data-filter]')
    if (f) {
      filter = f.dataset.filter
      const grid = document.getElementById('work-grid')
      grid.innerHTML = workGridHtml()
      grid.classList.remove('is-changing'); void grid.offsetWidth; grid.classList.add('is-changing')
      document.getElementById('work-empty').hidden = filteredProjects().length > 0
      f.parentElement.querySelectorAll('[data-filter]').forEach((b) => { const on = b.dataset.filter === filter; b.classList.toggle('is-active', on); b.setAttribute('aria-pressed', on) })
      mountImages(grid)
      if (lenis) lenis.resize()
      return
    }
    const cp = e.target.closest('[data-copy]')
    if (cp) { copyEmail(cp); return }
    const z = e.target.closest('[data-zoom]')
    if (z) { openLightbox(z.dataset.zoom); return }
    const lb = e.target.closest('[data-lb]')
    if (lb) { lb.dataset.lb === 'close' ? closeLightbox() : moveLightbox(Number(lb.dataset.lb)); return }
    if (lbIndex >= 0 && e.target.hasAttribute && e.target.hasAttribute('data-lb-bg')) closeLightbox()
  })
  document.addEventListener('keydown', (e) => {
    if (lbIndex < 0) return
    if (e.key === 'Escape') closeLightbox()
    if (e.key === 'ArrowRight') moveLightbox(1)
    if (e.key === 'ArrowLeft') moveLightbox(-1)
  })
  window.addEventListener('hashchange', () => { if (lbIndex >= 0) closeLightbox(); withCurtain(() => route()) })

  /* ------------------------------------------------------------ custom scrollbar */
  const sbar = document.getElementById('sbar'), thumb = document.getElementById('sbar-thumb')
  let sbIdle, sbRaf = 0, dragging = false
  function updateScrollbar(wake) {
    if (!sbRaf) sbRaf = requestAnimationFrame(() => {
      sbRaf = 0
      const docH = document.documentElement.scrollHeight, vh = window.innerHeight, trackH = sbar.clientHeight || vh
      sbar.hidden = docH <= vh + 4
      const h = Math.max(44, (vh / docH) * trackH), max = Math.max(1, docH - vh)
      thumb.style.height = `${h}px`
      thumb.style.transform = `translate3d(0, ${(Math.min(max, Math.max(0, window.scrollY)) / max) * (trackH - h)}px, 0)`
    })
    if (wake) {
      sbar.classList.add('is-active')
      clearTimeout(sbIdle)
      sbIdle = setTimeout(() => { if (!dragging) sbar.classList.remove('is-active') }, 1100)
    }
  }
  const scrollToY = (y, immediate) => lenis ? lenis.scrollTo(y, { immediate, force: true, duration: 1 }) : window.scrollTo({ top: y, behavior: immediate ? 'auto' : 'smooth' })
  thumb.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation()
    dragging = true; sbar.classList.add('is-drag')
    const startY = e.clientY, start = window.scrollY
    const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight)
    const ratio = max / Math.max(1, sbar.clientHeight - thumb.offsetHeight)
    const move = (ev) => scrollToY(start + (ev.clientY - startY) * ratio, true)
    const up = () => { dragging = false; sbar.classList.remove('is-drag'); updateScrollbar(true); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up) }
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up)
  })
  sbar.addEventListener('pointerdown', (e) => {
    if (e.target !== sbar) return
    const r = sbar.getBoundingClientRect(), max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight)
    scrollToY(Math.min(max, Math.max(0, ((e.clientY - r.top - thumb.offsetHeight / 2) / Math.max(1, r.height - thumb.offsetHeight)) * max)), false)
  })
  new ResizeObserver(() => updateScrollbar(false)).observe(document.body)
  window.addEventListener('resize', () => updateScrollbar(false), { passive: true })

  document.documentElement.lang = lang
  withCurtain(() => route())
  onScroll()
})()
</script>
